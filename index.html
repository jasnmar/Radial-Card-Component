<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Radial Card Component</title>
  </head>
  <body>
    <div class="controls">
      <label for="card-input">Card Count (2-20):</label>
      <input type="number" id="card-input" />
      <label for="color-input">Color (1-360):</label>
      <input type="text" id="color-input" />
      <label for="aspect-ratio">Aspect Ratio 1:</label>
      <input type="text" id="aspect-ratio" />
      <label for="arc-spread">Arc Spread (Degrees):</label>
      <input type="number" id="arc-spread" />
      <label for="card-depth">Card Depth (%):</label>
      <input type="number" id="card-depth" />
    </div>
    <div class="card-component" id="card-component">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </body>
  <script src="index.js"></script>
</html>
